name: CI

# The library, the CLI and the extension on the three platforms the extension ships for. The
# Sinsy engine (native/sinsy) is built on each, and its voice NIT SONG070 F001 (CC BY 3.0) is
# fetched as a user fetches it (`cantoria fetch nitech-song070`, checked by its SHA-256, kept in
# the cache), so the Sinsy tests and the published program sing on every platform. No other voice
# is installed (those are their authors', under their terms): the DiffSinger tests pass without
# singing (gated on CANTORIA_DIFFSINGER_VOICE); ONNX Runtime is proven to load and name its
# providers (`cantoria providers`).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: cantoria
            dml: ''
          - os: macos-latest
            rid: osx-arm64
            exe: cantoria
            dml: ''
          - os: windows-latest
            rid: win-x64
            exe: cantoria.exe
            dml: -p:UseDirectML=true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the Sinsy engine
        shell: pwsh
        run: ./tools/build-sinsy.ps1
      - name: Keep the Sinsy voice between runs
        uses: actions/cache@v4
        with:
          path: ~/sinsy-voices
          key: sinsy-voice-461c94d2
      - name: Fetch the Sinsy voice as a user does
        # pwsh: the path written for the next steps is the system's own (bash on Windows writes /c/…).
        shell: pwsh
        run: |
          $voices = Join-Path $HOME 'sinsy-voices'
          dotnet run --project src/Cantoria.Cli -c Release -- fetch nitech-song070 --sinsy-dir $voices
          if ($LASTEXITCODE -ne 0) { throw "fetch failed" }
          "CANTORIA_SINSY_VOICE=$(Join-Path $voices 'hts_voice_nitech_jp_song070_f001-0.90' 'nitech_jp_song070_f001.htsvoice')" >> $env:GITHUB_ENV
      - name: Test (the CPU package)
        run: dotnet test tests/Cantoria.Tests -c Release
      - name: Publish ${{ matrix.rid }}
        run: dotnet publish src/Cantoria.Cli -c Release -r ${{ matrix.rid }} --self-contained ${{ matrix.dml }} -o out/${{ matrix.rid }}
      - name: The program starts, reads a score, names its providers
        shell: bash
        run: |
          out/${{ matrix.rid }}/${{ matrix.exe }} --version
          out/${{ matrix.rid }}/${{ matrix.exe }} check examples/yukiyakonko.json
          out/${{ matrix.rid }}/${{ matrix.exe }} providers
      - name: The published program sings with Sinsy
        shell: bash
        run: |
          out/${{ matrix.rid }}/${{ matrix.exe }} sing examples/yukiyakonko.json --voice sinsy/nitech_jp_song070_f001 --sinsy-dir ~/sinsy-voices -o sung.wav
          test -s sung.wav
      - name: DirectML.dll ships with the Windows program
        if: matrix.rid == 'win-x64'
        shell: bash
        run: test -f out/win-x64/DirectML.dll

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check-types
      - run: npm test
