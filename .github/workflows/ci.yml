name: CI

# The library, the CLI and the extension on the three platforms the extension ships for. No voice
# is installed here (every voice is its author's, under its author's terms), so the singer tests
# pass without singing (they are gated on CANTORIA_DIFFSINGER_VOICE); what is proven per platform
# is that the self-contained program starts, reads a score, and that ONNX Runtime loads and names
# its providers (`cantoria providers`).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: cantoria
            dml: ''
          - os: macos-latest
            rid: osx-arm64
            exe: cantoria
            dml: ''
          - os: windows-latest
            rid: win-x64
            exe: cantoria.exe
            dml: -p:UseDirectML=true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test (the CPU package)
        run: dotnet test tests/Cantoria.Tests -c Release
      - name: Publish ${{ matrix.rid }}
        run: dotnet publish src/Cantoria.Cli -c Release -r ${{ matrix.rid }} --self-contained ${{ matrix.dml }} -o out/${{ matrix.rid }}
      - name: The program starts, reads a score, names its providers
        shell: bash
        run: |
          out/${{ matrix.rid }}/${{ matrix.exe }} --version
          out/${{ matrix.rid }}/${{ matrix.exe }} check examples/yukiyakonko.json
          out/${{ matrix.rid }}/${{ matrix.exe }} providers
      - name: DirectML.dll ships with the Windows program
        if: matrix.rid == 'win-x64'
        shell: bash
        run: test -f out/win-x64/DirectML.dll

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check-types
      - run: npm test
